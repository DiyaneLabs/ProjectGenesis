<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry Received | Klezmer</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/typography.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at 80% 20%,
                    rgba(18, 103, 232, 0.18),
                    transparent 35%),
                #050b18;

            color: white;
            font-family: Arial, sans-serif;
        }

        .success-page {
            width: min(90%, 700px);
            text-align: center;
        }

        .success-logo {
            display: inline-flex;
            margin-bottom: 50px;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 14px;
        }

        .logo-image{
             display: block;
    width: 400px;
    max-width: 100%;
    height: auto;
        }

        .success-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #1267e8;
            border-radius: 50%;

            color: #1267e8;
            font-size: 36px;
        }

        .success-label {
            display: inline-block;

            margin-bottom: 18px;

            color: #1267e8;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 20px;

            font-size: clamp(42px, 6vw, 72px);
            line-height: 0.95;
        }

        .success-message {
            max-width: 600px;
            margin: 0 auto 35px;

            color: #9ca8bb;

            font-size: 18px;
            line-height: 1.7;
        }

        .success-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            padding: 16px 28px;

            border-radius: 999px;

            background: #1267e8;
            color: white;

            text-decoration: none;
            font-weight: 700;

            transition: transform 0.2s ease,
                background 0.2s ease;
        }

        .success-button:hover {
            transform: translateY(-2px);
            background: #0f5bcf;
        }
    </style>

</head>


<body>

    <main class="success-page">

        <div class="success-logo">
            <img src="../assets/images/Logo.png" alt="Klezmer IT Solutions" class="logo-image">
        </div>


        <div class="success-icon">
            ✓
        </div>


        <span class="success-label">
            Enquiry Received
        </span>


        <h1>
            Thank you for contacting Klezmer.
        </h1>


        <p class="success-message">

            Your enquiry has been received and a member of our
            team will respond using the details you provided.

        </p>


        <a href="../index.html" class="success-button">

            Back to Klezmer

            <span>→</span>

        </a>

    </main>

</body>

</html>
